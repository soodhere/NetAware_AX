# Official CAMARA OpenAPI catalogue independently pinned for NetAware AX (Cadence 0).
# Source of truth: GitHub org camaraproject. Specs are copied locally into this repo;
# do not invent APIs, operationIds, or schemas beyond these files.
# This pin is independent of any other prototype. No runtime dependency on other repos.
#
# Buckets:
#   camara       = incubating/stable public releases (or superseded parent packs kept for reference)
#   experimental = sandbox public releases, or main-branch WIP specs with no public release
#
# Acquisition date: 2026-08-15
# Org: https://github.com/camaraproject (93 public repositories surveyed)

catalog:
  organization: camaraproject
  org_url: https://github.com/camaraproject
