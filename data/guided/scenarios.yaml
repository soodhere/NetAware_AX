      correlationId: HF-TURN-18-ax
    autonomy:
      observe_and_assess: ACT
      recommend_swap_device: ACT
      change_flight_plan: NOT_AUTHORIZED
      selectedAction: observe_and_assess
      selectedLevel: ACT
      note: Adjacent Ground Operations application. Does not change the flight plan. Not a Baggage Operations clone.
    visual:
      world: ground-ops
      deviceLabel: GSE handheld HF-GSE-2204
