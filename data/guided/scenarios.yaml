  - intentId: assure_live_broadcast
    id: apex-contribution
    enterpriseId: apex-media
    applicationId: apex-contribution
    agentId: contribution-agent
    useCaseId: live-broadcast
    policyId: apex-contribution-policy
    purposeId: experience_assurance
    complexity: COMPOSED
    axBehavior: bounded-action
    defaultVariant: slo-needs-qod
    region: CA
    businessEvent: A live contribution encoder is on-air against a configured SLO.
    decisionGap: Production control does not independently apply network treatment to hold the contribution objective.
    networkContribution: QoD because a contribution SLO exists. Insights experimental — skipped.
    close: Production still owns going to air. NetAware applies QoD when the SLO warrants it.
    existingSystems:
      - { id: production, label: Production control, kind: ENTERPRISE }
      - { id: encoder, label: Encoder, kind: ENTERPRISE }
      - { id: stream, label: Stream workflow, kind: ENTERPRISE }
    domainOperations:
      - operationId: getContributionSlo
        label: Contribution SLO
        apiKind: ENTERPRISE
        simulatedEnterpriseApi: true
        owner: Production control
    telcoFinder:
      neededBecause: Contribution encoder has a network identity for QoD session placement.
      input: encoder APX-ENC-3
      result:
        network: Specialist Provider C
        providerId: simulated-provider-c
        region: CA
        simulated: true
    candidateCapabilities:
      - capabilityId: quality_on_demand
        action: CALL
        reason: A contribution SLO is configured. QoD is the network treatment that can hold the objective.
      - capabilityId: connectivity_insights
        action: SKIP
        reason: Connectivity Insights is experimental CAMARA maturity and is not silently promoted.
      - capabilityId: edge_discovery
        action: SKIP
        reason: Edge discovery is not required to apply contribution QoD in this configuration.
    networkRoutes:
      createSession:
        routeType: HYBRID
        providerId: simulated-provider-c
        providerLabel: Specialist Provider C
        routeDisplay: Enterprise → NetAware → Specialist Provider C
    variants:
      slo-needs-qod:
        label: SLO requires QoD
        outcome:
          outcome: ASSURED
          recommendedAction: HOLD_CONTRIBUTION_TREATMENT
          decisionOwner: APEX_PRODUCTION
          reasonCodes: [QOD_SESSION_CREATED]
          summary: QoD session created against the contribution SLO. Production still owns going to air.
          confidence: 0.89
        evidence:
          createSession:
            latencyMs: 60
            httpStatus: 201
            raw: { qosStatus: REQUESTED, sessionId: qod-apx-3 }
            evidence: { type: QOD_SESSION, status: CREATED, encoderId: APX-ENC-3 }
    request:
      intent: assure_live_broadcast
      subject: { encoderId: APX-ENC-3, contributionId: APX-LIVE-12 }
      context: { sloMs: 40, guidedVariant: slo-needs-qod }
    correlation:
      executionId: ax-apx-contrib-001
      traceId: ax-apx-contrib-trace
      correlationId: APX-LIVE-12-ax
    autonomy:
      observe_and_assess: ACT
      invoke_qod: ACT
      take_production_to_air: NOT_AUTHORIZED
      selectedAction: invoke_qod
      selectedLevel: ACT
      note: Agent may invoke QoD. Production owns going to air.
    visual:
      world: contribution
      alreadyHave: [Production control, Encoder, Stream workflow]
      gap: Can network treatment hold the contribution SLO?
      adds: Quality on Demand
