  - intentId: ensure_baggage_connection
    label: Assure ramp scan capability
    workingAlias: assure_ramp_scan_capability
    businessOutcome: Confirm the assigned ramp scanner can complete the connected baggage custody operation before load-close
    complexity: COMPOSED
    enterpriseId: high-flight-airlines
    applicationId: high-flight-baggage-operations
    authorizedActors: [baggage-operations-agent]
    purposeId: baggage_connection_assurance
    regions: [CA]
    candidateCapabilities:
      - { id: device_reachability, role: required }
      - { id: roaming_status, role: considered }
      - { id: connectivity_insights, role: considered }
      - { id: location_verification, role: considered }
      - { id: quality_on_demand, role: considered }
    minimumEvidence: [DEVICE_REACHABILITY]
    optionalEvidence: [ROAMING]
    dataMinimization: true
    reusePolicy: { allowed: false }
    failurePolicy: ESCALATE
    autonomy: ACT observe; RECOMMEND swap/reassign/offline/hold; NOT_AUTHORIZED to change the flight plan or move bags
    decisionOwner: HIGH_FLIGHT_OPERATIONS
    verificationRequirement: none
    networkContributionTier: B
    note: Executable id remains ensure_baggage_connection. Working alias is documentation only — not a second live Intent.
    decisionGap:
      alreadyHave:
        - BRS (bag, flight, required custody/load event)
        - DCS (HF281, load-close)
        - Ground Operations (assigned handler and scanner HF-HDL-0192)
        - Operational deadline
      decide: Can this assigned connected device complete the required baggage digital operation before load-close?
      gap: BRS / DCS / Ground Operations do not independently know whether this mobile device can currently participate in the operator data-network workflow.
      networkAdds:
        - Device DATA reachability
        - Roaming only if it materially explains or changes the action
        - Connectivity only if it changes CONTINUE vs SWAP
      ax:
        - Map bag / worker to assigned scanner network identity
        - Discover Reachability
        - Skip Location and QoD by default — they do not close this gap
        - Recommend CONTINUE or SWAP_DEVICE from enterprise inventory
      outcome: CONTINUE or SWAP_DEVICE

  - intentId: prepare_ota_cohort
    label: Prepare OTA cohort
    businessOutcome: Network-qualified OTA cohort for an existing enterprise firmware campaign
    complexity: ADVANCED_AGENTIC
    enterpriseId: acme-manufacturing
    applicationId: acme-device-fleet
    authorizedActors: [device-ops-agent]
    purposeId: firmware_rollout
    regions: [configured]
    candidateCapabilities:
      - { id: device_reachability, role: required }
      - { id: roaming_status, role: required }
      - { id: connectivity_insights, role: considered }
      - { id: quality_on_demand, role: considered }
      - { id: location_verification, role: considered }
    minimumEvidence: [DEVICE_REACHABILITY]
    optionalEvidence: [ROAMING]
    dataMinimization: true
    reusePolicy: { allowed: true, ttl: configured, purposeCompatibility: same enterprise, device-ops purpose }
    failurePolicy: DEFER_AND_RETRY
    autonomy: ACT discover/segment/recommend; ACT_WITH_APPROVAL submit cohort; NOT_AUTHORIZED to install firmware
    decisionOwner: ACME_OTA_PLATFORM
    verificationRequirement: none
    networkContributionTier: A
    workingAlias: rollout_firmware_safely
    note: Complexity is ADVANCED_AGENTIC because fleet multi-provider discovery, policy interpretation, and closed-loop reassessment are required. Working alias is documentation only.
    decisionGap:
      alreadyHave:
        - Device Management / OTA Platform
        - Inventory
        - Device Twin
        - Firmware Campaign
        - Compatibility
        - Target firmware
        - Device health
      decide: Which eligible devices should enter the rollout cohort now?
      gap: The OTA platform does not independently have authoritative current operator-network knowledge for every cellular device needed to determine whether it is network-suitable for this rollout window.
      networkAdds:
        - Device Reachability
        - Roaming Status where material, interpreted by configured enterprise policy
      ax:
        - Discover
        - Filter
        - Segment
        - Select
        - Recommend / act within configured authority
        - Observe
        - Reassess
      outcome: NETWORK_QUALIFIED_COHORT or COHORT_EXPANDED

