# Cadence 10 — onboarded Intent Profiles. HTTP request stays small.
# This is configured knowledge, not a second planner.

intentProfiles:
  - intentId: verify_mobile_number
    label: Verify this mobile number
    businessOutcome: Silent number possession verification for sign-in
    complexity: ADVANCED_AGENTIC
    enterpriseId: rocket-bank
    applicationId: rocket-bank-iam
    authorizedActors: [iam-sign-in-agent]
    purposeId: mobile_number_authentication
    regions: [configured]
    candidateCapabilities:
      - { id: number_possession_verification, role: required }
    minimumEvidence: [NUMBER_POSSESSION]
    optionalEvidence: []
    dataMinimization: true
    reusePolicy: { allowed: false, purposeCompatibility: sign-in only }
    failurePolicy: CAPABILITY_UNAVAILABLE
    autonomy: ACT verify; NOT_AUTHORIZED to issue the application session
    decisionOwner: ROCKET_BANK_IAM
    verificationRequirement: none
    networkContributionTier: A
    note: Complexity is ADVANCED_AGENTIC because path selection is dynamic. A cellular-only telling can be presented as BASIC.
    decisionGap:
      alreadyHave:
        - CIAM / IAM
        - Claimed mobile number
        - Login / session systems
      decide: Can this claimed number be silently verified?
      gap: IAM does not independently have operator-backed number possession.
      networkAdds:
        - Number Verification
      ax:
        - Discover runtime access context
        - Govern purpose, entitlement and operator readiness
        - Select NV1 or NV2 path — the application does not choose the path
        - Call or return CAPABILITY_UNAVAILABLE
      outcome: VERIFIED or CAPABILITY_UNAVAILABLE

  - intentId: assess_network_trust
    label: Assess network trust
    businessOutcome: Recommend whether a high-value payment should proceed or step up
    complexity: COMPOSED
    enterpriseId: rocket-bank
    applicationId: rocket-bank-payments
    authorizedActors: [payments-protection-agent]
    purposeId: payment_fraud_assist
    regions: [configured]
    candidateCapabilities:
      - { id: number_possession_verification, role: required }
      - { id: sim_continuity, role: required }
      - { id: device_continuity, role: required }
      - { id: device_identifier, role: required }
      - { id: roaming_status, role: required }
      - { id: location_verification, role: considered }
      - { id: number_recycling, role: considered }
    minimumEvidence: [NUMBER_POSSESSION, SIM_CONTINUITY, DEVICE_CONTINUITY]
    optionalEvidence: [ROAMING, DEVICE_IDENTIFIER]
    dataMinimization: true
    reusePolicy: { allowed: true, ttl: configured, purposeCompatibility: same subject, compatible purpose }
    failurePolicy: CONTINUE_WITHOUT
    autonomy: RECOMMEND step-up; NOT_AUTHORIZED to decline the transaction
    decisionOwner: ROCKET_BANK_FRAUD
    verificationRequirement: none
    networkContributionTier: B
    decisionGap:
      alreadyHave:
        - Payments platform
        - Authentication
        - Fraud signals
      decide: Proceed normally or require additional verification?
      gap: The application does not independently know recent SIM, device or network identity continuity.
      networkAdds:
        - Number possession
        - SIM / device / roaming continuity evidence
      ax:
        - Discover relevant capabilities
        - Govern purpose, consent and entitlement
        - Select minimum sufficient evidence
        - Skip or filter what is not needed or not permitted
      outcome: STEP_UP

  - intentId: assess_recovery_continuity
    label: Assess recovery continuity
    businessOutcome: Continue normal recovery or step up when continuity is inconsistent
    complexity: COMPOSED
    enterpriseId: rocket-bank
    applicationId: rocket-bank-payments
    authorizedActors: [payments-protection-agent]
    purposeId: identity_continuity_assist
    regions: [configured]
    candidateCapabilities:
      - { id: sim_continuity, role: required }
      - { id: device_continuity, role: required }
      - { id: roaming_status, role: considered }
    minimumEvidence: [SIM_CONTINUITY, DEVICE_CONTINUITY]
    optionalEvidence: [ROAMING]
    dataMinimization: true
    reusePolicy: { allowed: true, ttl: configured, purposeCompatibility: identity continuity }
    failurePolicy: CONTINUE_WITHOUT
    autonomy: ACT assess; NOT_AUTHORIZED to reset credentials
    decisionOwner: ROCKET_BANK_IAM
    verificationRequirement: none
    networkContributionTier: B
    decisionGap:
      alreadyHave:
        - IAM / account recovery workflow
      decide: Can normal recovery continue?
      gap: Recovery does not independently know whether telecom/device continuity is consistent.
      networkAdds:
        - Continuity evidence, including governed reuse
      ax:
        - Reuse prior evidence when purpose, subject, region, agreement and TTL allow
        - Skip duplicate Network API calls
      outcome: CONTINUITY_ALIGNED

  - intentId: maintain_inspection_experience
    label: Maintain inspection experience
    businessOutcome: Restore the inspection camera SLO when network treatment can help
    complexity: ADVANCED_AGENTIC
    enterpriseId: acme-manufacturing
    applicationId: acme-quality-inspection
    authorizedActors: [inspection-experience-agent]
