      - { id: edge_discovery, role: considered }
      - { id: device_reachability, role: considered }
    minimumEvidence: [CONNECTIVITY]
    optionalEvidence: [QOD]
    dataMinimization: true
    reusePolicy: { allowed: false }
    failurePolicy: ESCALATE
    autonomy: ACT observe and QoD; NOT_AUTHORIZED to change MES routing
    decisionOwner: ACME_QUALITY
    verificationRequirement: after_act
    networkContributionTier: A
    decisionGap:
      alreadyHave:
        - MES
        - QMS
        - Vision / camera application
        - Required SLO
      decide: Can network intervention restore the application objective?
      gap: The enterprise knows the camera is degraded but cannot itself change mobile network treatment.
      networkAdds:
        - Connectivity observation
        - Quality-on-Demand action when useful
      ax:
        - Observe
        - Skip QoD while the objective holds
        - Act after breach
        - Verify
      outcome: ASSURED

  - intentId: verify_pharmacy_age_gate
