# Cadence 7 — Entitlement is not subscription.
# Subscription: has the API owner ordered the API product?
# Entitlement: may this application/agent actually invoke the capability?
# Migrated 1:1 from prior implicit "subscribed ⇒ entitled" so current hero outcomes stay unchanged.

entitlements:
  - id: rb-identity-entitlement
    subscriptionId: rb-identity-sub
    enterpriseId: rocket-bank
    applicationId: rocket-bank-payments
    agentId: payments-protection-agent
    capabilityFamily: IDENTITY_AND_TRUST
    status: active
    note: Migrated from Cadence 6 implicit entitlement. Not equivalent to subscription as a concept.

  - id: rb-iam-identity-entitlement
    subscriptionId: rb-identity-sub
    enterpriseId: rocket-bank
    applicationId: rocket-bank-iam
    agentId: iam-sign-in-agent
    capabilityFamily: IDENTITY_AND_TRUST
    status: active
    note: Same enterprise subscription. Different application entitlement for Digital Identity / IAM.

  - id: rb-device-entitlement
    subscriptionId: rb-device-sub
    enterpriseId: rocket-bank
    applicationId: rocket-bank-payments
    agentId: payments-protection-agent
    capabilityFamily: DEVICE
    status: active

  - id: rb-mobility-entitlement
    subscriptionId: rb-mobility-sub
    enterpriseId: rocket-bank
    applicationId: rocket-bank-payments
    agentId: payments-protection-agent
    capabilityFamily: LOCATION_AND_MOBILITY
    status: active
    note: Entitled does not imply consent is available.

