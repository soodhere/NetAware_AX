# Cadence 7 froze the OTA shape. Cadence 11 makes it live under a new Intent id.
# rollout_firmware_safely remains a documentation alias — not executable.

model:
  cadence: 11
  executable: true
  applicationExistsNow: true
  intentId: rollout_firmware_safely
  liveIntentId: prepare_ota_cohort
  label: Prepare network-qualified OTA cohort
  enterpriseId: acme-manufacturing
  applicationId: acme-device-fleet
  note: Cadence 11 live Intent is prepare_ota_cohort. NetAware does not flash firmware. Working alias rollout_firmware_safely is documentation only.

purpose:
  axId: firmware_rollout
  dpv:
    vocabulary: DPV
    version: "2.3"
    id: dpv:ImproveExistingProductsAndServices
    iri: https://w3id.org/dpv#ImproveExistingProductsAndServices
    label: Improve Existing Products and Services
    context: Planned firmware 8.4 rollout. Network state gates campaign cohorts. NetAware does not flash firmware.
    tmf931Overlap: true
  alternativeIfFixCampaign: dpv:RepairImpairments

enterpriseAlreadyHas:
  - inventory
  - device twin
  - firmware package
  - OTA campaign manager
  - telemetry

networkAdds:
  required: [device_reachability, roaming_status]
  optional: []
  notInvoked:
    connectivity_insights: experimental / not required to change the cohort decision
  defaultNotRequired:
    quality_on_demand: true
    location_verification: true
    location_retrieval: true
    edge_discovery: true
    connectivity_insights: true

agenticShape:
  - DISCOVER
  - SEGMENT
  - PLAN_COHORT
  - ENTERPRISE_OTA_ACTION
  - OBSERVE
  - REPLAN
  - VERIFY

firmwareDistributionOwner: ENTERPRISE_OTA_API
networkDoesNotFlashFirmware: true

domainOperations:
  kind: DOMAIN_OR_ENTERPRISE
  notCamara: true
  operations:
    - listDevices
    - getDevice
    - getTwin
    - getPackage
    - createCampaign
    - startWave
    - getCampaignStats
    - latestCheckIn
    - addDevicesToCampaign
    - startCampaign

networkOperations:
  fromActiveCatalog:
    - getReachabilityStatus
    - getRoamingStatus
  consideredNotRequired:
    - checkNetworkQuality
  notInPlanByDefault:
    - createSession
    - verifyLocation
    - readClosestEdgeCloudZone
    - checkNetworkQuality

catalogGapsNotAdmittedInCadence7:
  - Device Reachability Status Subscriptions
  - eSIM remote management / FOTA
  - Connected Network Type
