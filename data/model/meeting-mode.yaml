cues:
  - { id: nv-path, say: "Notice the application never requested NV1 or NV2.", ask: "Does your application team know which operators support this today?", point: "The API exists, but fulfillment can be blocked by operator readiness.", close: "This is the bridge between enterprise demand and network supply." }
  - { id: hf, say: "NetAware does not track or move the bag.", ask: "Can the assigned scanner complete the digital workflow?", point: "Network reachability helps the baggage system know whether the assigned device can complete the scan.", close: "A simple network signal improves an existing operational workflow." }

faq:
  - { q: "Is this replacing CAMARA?", a: "No. NetAware AX uses Network APIs as the execution layer. AX adds Intent, discovery, governance and fulfillment above them." }
  - { q: "Is NetAware making the business decision?", a: "Only within configured autonomy. For example Rocket Bank still owns the financial decision." }
  - { q: "Is this a generic AI agent?", a: "No. The prototype uses deterministic configured behavior. The AX architecture is designed around governed Intent execution." }
  - { q: "Does NetAware own operator APIs?", a: "No. Operators expose network capabilities. NetAware discovers and fulfills Intents using available direct or aggregated supply." }
  - { q: "Is this live operator availability?", a: "No. Coverage in this prototype is configured demo coverage." }

dx:
  dx: [Developer discovers API, Developer selects API, Developer implements operator-specific flow, Developer handles policy / availability differences]
  ax: [Application or authorized agent expresses Intent, NetAware discovers capabilities, NetAware applies configured governance, NetAware resolves operator and supply, NetAware selects fulfillment, NetAware invokes or reuses evidence, NetAware can replan / act within authorization, NetAware returns business outcome]
  note: AX builds on Network API DX. AX does not replace DX.

