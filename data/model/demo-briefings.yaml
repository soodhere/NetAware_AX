# Cadence 6.1 presentation clarity patch. Product behavior frozen; labels and briefing structure only.

networkValueFraming:
  headline: Your application stays in its domain. Network APIs add what it cannot see, verify, or act on itself.
  applicationLayer: Your application / domain APIs tell NetAware what is happening in the business.
  networkLayer: Network APIs provide information, verification or network actions the application does not have itself.
  axLayer: NetAware AX decides when those complementary network capabilities can materially help achieve the Intent.
  intentLine: Intent is the outcome requested by the application or agent without specifying which Network APIs to invoke.

product:
  line: From Developer Experience to Agentic Experience
  tagline: A simpler way for applications and agents to consume network capabilities.
  support: Keep your application. Express the outcome. Let NetAware handle the Network API complexity.
  discoveryLine: NetAware determines which network capabilities are relevant, allowed, available and useful — then invokes only what is needed.
  intentDefinition: Intent is the outcome the application or agent wants — without specifying which Network APIs should be called.
  equation:
    - Your world
    - Network capabilities
    - Intent
  result: Agentic Experience
  axLoop:
    - Understand
    - Govern
    - Discover
    - Plan
    - Execute
    - Observe
    - Replan
    - Verify

honesty:
  configurationOnly: false
  executionEngine: true
  executableIntents:
    - assess_network_trust
    - ensure_baggage_connection
    - maintain_inspection_experience
    - verify_pharmacy_age_gate
    - verify_mobile_number
    - prepare_ota_cohort
  potentiallyRelevantOnly: false
  actuallyInvokedUnknown: false
  identityArchitectureUnresolved: true

featuredEnterprises:
  - enterpriseId: rocket-bank
    storyId: rocket-bank-iam-nv
    presentationOrder: 0
    domainAudienceLabel: Identity / IAM
    heroUseCaseId: passwordless-mobile-sign-in
    heroCard:
      cardTitle: Passwordless mobile sign-in
      businessProblem: Same Intent. Cellular or Wi-Fi. NetAware selects the available Number Verification path.
      intentId: verify_mobile_number
      proves:
        - Same Intent, different fulfillment
        - Path selection, not NV1=verify / NV2=share
        - Operator readiness can block qualified demand
    useCaseIds:
      - passwordless-mobile-sign-in
    relatedUseCaseIds:
      - high-value-payment-protection
      - account-recovery-anomaly
    existingSystems:
      - IAM / Sign-in
    environment: Production
    regionDisplay: Configured
    subscriptionsDisplay: Configured
    providersDisplay: Configured
    securityDisplay: Configured
    valueClarity:
      hero:
        headline: One Intent. NetAware selects the Number Verification path that can actually serve this access type.
        zeroContextAnswer: Silent number possession verification — without the application coding NV1 vs NV2.
        myWorld:
          title: What Rocket Bank already knows
          items:
            - Customer is signing in (IAM event)
            - Claimed mobile number
            - Existing IAM / session systems
        networkAdds:
          title: What the Network uniquely adds
          items:
            - Silent verification that the handset possesses the claimed number
            - Network-based path (NV1) when the device is on cellular
            - Operator-token path (NV2) when the device is on Wi-Fi and the operator is ready
          roles: [VERIFY]
        netawareAx:
          title: How NetAware AX uses both
          items:
            - Application asks only to verify this mobile number
            - Access type comes from runtime client context — not Telco Finder
            - Telco Finder names the operator; API Finder checks Number Verification availability; operator readiness decides NV1 vs NV2
            - If Entitlement Server is unavailable on Wi-Fi, demand stays unfulfilled — no fake NV1, no SMS OTP
        openingHeroNote: Strongest same-Intent / different-fulfillment story. Payments Risk remains the adjacent Rocket Bank trust demo.
  - enterpriseId: high-flight-airlines
    presentationOrder: 4
    domainAudienceLabel: Airlines
    heroUseCaseId: baggage-connection
    heroCard:
      cardTitle: Baggage handling / ramp device operability
      businessProblem: Can the assigned ramp scanner complete the connected custody scan before load-close?
      intentId: ensure_baggage_connection
      proves:
        - BRS / DCS stay in place
        - Network subject is the handheld, not the bag
        - Reachability changes CONTINUE vs SWAP
    useCaseIds:
      - baggage-connection
      - locate-baggage
    relatedUseCaseIds:
      - turnaround-video
    existingSystems:
      - BRS
      - DCS
      - Ground Operations
    environment: Production
    regionDisplay: Configured
    subscriptionsDisplay: Configured
    providersDisplay: Configured
    securityDisplay: Configured
    valueClarity:
      hero:
        headline: BRS already knows the bag, the flight, and who should scan. NetAware answers whether that scanner can complete the scan on the operator network before load-close.
        zeroContextAnswer: DATA reachability of assigned scanner HF-HDL-0192 — not bag tracking, not a replacement for BRS.
        myWorld:
          title: What High Flight already knows
          items:
            - Bag HF123456 and required custody/load event (BRS)
            - Connecting flight HF281 and load-close (DCS)
            - Assigned ramp worker and rugged scanner HF-HDL-0192 (Ground Operations)
        networkAdds:
          title: What the Network uniquely adds
          items:
            - Device DATA reachability of the assigned handheld
            - Roaming only if it materially changes the action
            - Connectivity only if it changes CONTINUE vs SWAP
            - Location and QoD are NOT_REQUIRED — Network Location is not bag tracking
          roles: [OBSERVE]
        netawareAx:
          title: How NetAware AX uses both
          items:
            - Intent asks whether the assigned device can complete the digital operation
            - Maps bag / worker → scanner → network identity
            - Selects Reachability; skips Location and QoD
            - Returns CONTINUE or SWAP_DEVICE — airline still owns physical bag handling
        openingHeroNote: Keep the baggage-handling business story. Network contribution is scanner operability, not expedite-transfer.

