intentExamples:
  verify_mobile_number:
    plain: Verify this mobile number so the customer can sign in.
    request:
      intent: verify_mobile_number
      subject:
        phoneNumber: "+1••••••0198"
      context:
        nvVariant: cellular-nv1
        accessType: CELLULAR
        claimedMsisdn: true
        businessEvent: CUSTOMER_SIGNING_IN
  assess_network_trust:
    plain: Assess whether high-value payment RB-78421 should proceed based on network identity continuity.
    request:
      intent: assess_network_trust
      subject:
        transactionId: RB-78421
        phoneNumber: "+1••••••0198"
      context:
        amount: 25000
        currency: USD
  ensure_baggage_connection:
    plain: Assure assigned scanner HF-HDL-0192 can complete the connected custody scan for bag HF123456 before load-close.
    request:
      intent: ensure_baggage_connection
      subject:
        bagId: HF123456
        connectingFlight: HF281
      context:
        priority: high
  locate_baggage:
    plain: Help handlers locate bag HF123456.
    request:
      intent: locate_baggage
      subject:
        bagId: HF123456
      context:
        priority: high
  maintain_inspection_experience:
    plain: Maintain the experience required for inspection camera ACME-CAM-14 on LINE-B.
    request:
      intent: maintain_inspection_experience
      subject:
        cameraId: ACME-CAM-14
        lineId: LINE-B
      context:
        sloMs: 40
  verify_pharmacy_age_gate:
    plain: Verify whether the customer meets the age threshold for pharmacy transaction RX-10442.
    request:
      intent: verify_pharmacy_age_gate
      subject:
        transactionId: RX-10442
        phoneNumber: "+1••••••8843"
      context:
        ageThreshold: 18
  assess_recovery_continuity:
    plain: Check whether this account recovery still looks consistent with the customer's SIM and device.
    request:
      intent: assess_recovery_continuity
      subject:
        recoveryId: RB-REC-19
      context:
        channel: web
  match_customer_kyc:
    plain: Match customer attributes against operator KYC when purpose and consent allow.
    request:
      intent: match_customer_kyc
      subject:
        customerRef: RB-C-4401
      context:
        purpose: kyc_attribute_match
  prepare_ota_cohort:
    plain: Prepare a network-qualified OTA cohort for Acme's critical firmware campaign without installing firmware.
    request:
      intent: prepare_ota_cohort
      subject:
        campaignId: ACME-FW-8-4-CRITICAL
        applicationId: acme-device-fleet
      context:
        otaWave: prepare
        campaignPriority: CRITICAL
  assure_delivery_device:
    plain: Can the assigned connected handheld complete the required digital delivery workflow?
    request:
      intent: assure_delivery_device
      subject:
        jobId: SS-JOB-8814
        deviceId: SS-HDL-4412
        driverId: DR-204
      context:
        priority: HIGH
        guidedVariant: device-reachable
  assess_checkout_trust:
    plain: Should this high-risk checkout proceed normally or step up?
    request:
      intent: assess_checkout_trust
      subject:
        orderId: MM-88421
        phoneNumber: "+1••••••5521"
      context:
        amount: 1840
        currency: CAD
        guidedVariant: sim-recent-change
  assess_claim_device_trust:
    plain: Return network identity-continuity evidence to claims. Do not determine fraud.
    request:
      intent: assess_claim_device_trust
      subject:
        claimId: NS-CL-1902
        phoneNumber: "+49••••••4410"
      context:
        region: DE
        guidedVariant: evidence-returned
  assure_ground_device:
    plain: Can the assigned ground handheld complete the connected turnaround workflow?
    request:
      intent: assure_ground_device
      subject:
        taskId: HF-TURN-18
        deviceId: HF-GSE-2204
      context:
        guidedVariant: gse-reachable
  assure_technician_device:
    plain: Can the assigned technician device complete the digital work-order steps?
    request:
      intent: assure_technician_device
      subject:
        workOrderId: WO-5519
        deviceId: ACME-TECH-77
      context:
        guidedVariant: tech-reachable
  assure_live_broadcast:
    plain: Can network treatment help maintain the live contribution objective?
    request:
      intent: assure_live_broadcast
      subject:
        encoderId: APX-ENC-3
        contributionId: APX-LIVE-12
      context:
        sloMs: 40
        guidedVariant: slo-needs-qod
