        networkAdds:
          title: What the Network already contributed
          items:
            - Prior SIM, device and roaming evidence from trust assessment
          roles: [OBSERVE]
        netawareAx:
          title: How NetAware AX reuses evidence
          items:
            - Checks TTL, purpose and subject alignment
            - Returns CONTINUITY_ALIGNED without re-invoking APIs
