intentExamples:
  verify_mobile_number:
    plain: Verify this mobile number so the customer can sign in.
    request:
      intent: verify_mobile_number
      subject:
        phoneNumber: "+1••••••0198"
      context:
        nvVariant: cellular-nv1
        accessType: CELLULAR
        claimedMsisdn: true
        businessEvent: CUSTOMER_SIGNING_IN
  assess_network_trust:
    plain: Assess whether high-value payment RB-78421 should proceed based on network identity continuity.
    request:
      intent: assess_network_trust
      subject:
        transactionId: RB-78421
        phoneNumber: "+1••••••0198"
      context:
        amount: 25000
        currency: USD
  ensure_baggage_connection:
    plain: Ensure bag HF123456 makes connecting flight HF281.
    request:
      intent: ensure_baggage_connection
      subject:
        bagId: HF123456
        connectingFlight: HF281
      context:
        priority: high
  locate_baggage:
    plain: Help handlers locate bag HF123456.
    request:
      intent: locate_baggage
      subject:
        bagId: HF123456
      context:
        priority: high
  maintain_inspection_experience:
    plain: Maintain the experience required for inspection camera ACME-CAM-14 on LINE-B.
    request:
      intent: maintain_inspection_experience
      subject:
        cameraId: ACME-CAM-14
        lineId: LINE-B
      context:
        sloMs: 40
  verify_pharmacy_age_gate:
    plain: Verify whether the customer meets the age threshold for pharmacy transaction RX-10442.
    request:
      intent: verify_pharmacy_age_gate
      subject:
        transactionId: RX-10442
        phoneNumber: "+1••••••8843"
      context:
        ageThreshold: 18
  assess_recovery_continuity:
    plain: Check whether this account recovery still looks consistent with the customer's SIM and device.
    request:
      intent: assess_recovery_continuity
      subject:
        recoveryId: RB-REC-19
      context:
        channel: web
  match_customer_kyc:
    plain: Match customer attributes against operator KYC when purpose and consent allow.
    request:
      intent: match_customer_kyc
      subject:
        customerRef: RB-C-4401
      context:
        purpose: kyc_attribute_match
