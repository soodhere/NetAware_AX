    environment: Production
    regionDisplay: Configured
    subscriptionsDisplay: Configured
    providersDisplay: Configured
    securityDisplay: Configured
    valueClarity:
      hero:
        headline: Bank authentication can succeed while SIM, device or network continuity has changed. NetAware adds independent network evidence.
        zeroContextAnswer: Independent SIM, device and network continuity evidence the bank's own APIs cannot provide.
        myWorld:
          title: What Rocket Bank already knows
          items:
            - Transaction amount and context (Payments API)
            - Account and customer context (Core Banking)
            - Application authentication outcome (Fraud Decisioning)
        networkAdds:
