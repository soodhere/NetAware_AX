# Cadence 10 — High Flight ramp-scanner operability.
# Two presenter-simulated operational states. One Intent. Bag remains domain context.
# Deterministic. Fictional. No live operator. Configured demo policy only.

scenario:
  id: high-flight-baggage
  executableIntent: ensure_baggage_connection
  defaultVariant: scanner-ready
  enterpriseId: high-flight-airlines
  applicationId: high-flight-baggage-operations
  agentId: baggage-operations-agent
  useCaseId: baggage-connection
  policyId: high-flight-baggage-policy
  historicalStory:
    outcome: AT_RISK
    recommendedAction: EXPEDITE_TRANSFER
    status: SUPERSEDED
    note: Cadence 3–9 featured expedite-transfer. Cadence 10 featured live story is ramp-scanner operability. Explorer may still show the old graph mapping.
  correlation:
    intentId: ensure_baggage_connection
    executionId: ax-hf-ramp-001
    traceId: ax-hf-ramp-trace
    correlationId: HF123456-ax
  request:
    intent: ensure_baggage_connection
    subject:
      bagId: HF123456
      connectingFlight: HF281
    context:
      priority: high
  networkSubject:
    bagId: HF123456
    bagRole: DOMAIN_CONTEXT
    scannerId: HF-HDL-0192
    worker: Ramp agent 441
    deviceId: HF-HDL-0192
    networkIdentifier: "+1••••••7712"
    note: Bag is domain context. Network identifier comes from the assigned rugged scanner, not the suitcase.
  telcoFinder:
    neededBecause: Bag HF123456 is assigned to connected scanner HF-HDL-0192. Telco Finder resolves which network holds that device's subscription.
    subjectChain:
      - { entity: bag, id: HF123456, role: DOMAIN_CONTEXT }
      - { entity: ramp worker, id: HF-RAMP-441 }
      - { entity: assigned scanner, id: HF-HDL-0192, role: NETWORK_SUBJECT }
      - { entity: network identifier, value: "+1••••••7712" }
    input: "+1••••••7712"
    result:
      network: Network Provider A
      providerId: simulated-operator-a
      homeNetwork: true
      region: CA
      simulated: true
    doesNotTrackBag: true
  networkRoutes:
    getReachabilityStatus:
      routeType: DIRECT
      providerId: simulated-operator-a
      providerLabel: Network Provider A
      routeDisplay: NetAware → Network Provider A
    checkNetworkQuality:
      routeType: AGGREGATED
      providerId: simulated-aggregator-b
      aggregatorLabel: Aggregator A
      providerLabel: Network Provider A
      routeDisplay: NetAware → Aggregator A → Network Provider A
    verifyLocation:
      routeType: AGGREGATED
      providerId: simulated-provider-c
      aggregatorLabel: Aggregator A
      providerLabel: Network Provider A
      routeDisplay: NetAware → Aggregator A → Network Provider A
  domainResponses:
    getBaggageJourney:
      httpStatus: 200
      latencyMs: 35
      raw:
        system: BRS
        bagId: HF123456
        requiredEvent: CUSTODY_LOAD_SCAN
        status: AWAITING_LOAD_SCAN
        lastScanLocation: T-B-SORT-12
        lastScanAt: "2026-08-17T17:52:00-04:00"
        handlerDeviceId: HF-HDL-0192
      evidence:
        type: BRS_CUSTODY
        status: awaiting_load_scan
        requiredEvent: CUSTODY_LOAD_SCAN
        note: Airline BRS custody event — not network location.
    getFlightStatus:
      httpStatus: 200
      latencyMs: 28
      raw:
        system: DCS
        flight: HF281
        gate: B22
        loadCloseAt: "2026-08-17T18:25:00-04:00"
        status: ON_TIME
      evidence:
        type: DCS_FLIGHT
        status: on_time
        minutesUntilLoadClose: 28
    getRampAssignment:
      httpStatus: 200
      latencyMs: 22
      raw:
        system: Ground Operations
        bagId: HF123456
        workerId: HF-RAMP-441
        scannerId: HF-HDL-0192
        deviceType: ruggedized_brs_handheld
        deadline: load-close
      evidence:
        type: RAMP_ASSIGNMENT
        status: assigned
        scannerId: HF-HDL-0192
        workerId: HF-RAMP-441
    assignAlternateScanner:
      httpStatus: 200
      latencyMs: 31
      raw:
        system: Ground Operations / handheld inventory
        fromDevice: HF-HDL-0192
        toDevice: HF-HDL-0208
        reason: ASSIGNED_SCANNER_NOT_DATA_REACHABLE
      evidence:
        type: DEVICE_SWAP
        status: assigned_alternate
        fromDevice: HF-HDL-0192
        toDevice: HF-HDL-0208
        apiKind: ENTERPRISE
        note: Alternate scanner comes from enterprise inventory. This is not a Network API.
  variants:
    scanner-ready:
      label: Assigned scanner reachable
      presenterControl: SIMULATE OPERATIONAL CONTEXT
      reachable: true
      outcome:
        outcome: CONTINUE
        confidence: 0.93
        recommendedAction: CONTINUE
        decisionOwner: HIGH_FLIGHT_OPERATIONS
        approvalRequired: false
        limitingFactor: NONE
        networkConstraint: false
        reasonCodes: [ASSIGNED_SCANNER_DATA_REACHABLE]
        summary: Assigned scanner HF-HDL-0192 is DATA reachable. The connected BRS custody scan can proceed before load-close. Network does not move the bag.
      networkResponses:
        getReachabilityStatus:
          httpStatus: 200
          latencyMs: 44
          raw:
            reachable: true
            lastSeen: "2026-08-17T17:53:00-04:00"
          evidence:
            type: DEVICE_REACHABILITY
            status: reachable
            note: Confirms assigned ramp scanner can participate. Does not provide physical bag location.
    scanner-unreachable:
      label: Assigned scanner not reachable
      presenterControl: SIMULATE OPERATIONAL CONTEXT
      reachable: false
      outcome:
        outcome: SWAP_DEVICE
        confidence: 0.91
        recommendedAction: SWAP_DEVICE
        decisionOwner: HIGH_FLIGHT_OPERATIONS
        approvalRequired: false
        limitingFactor: ASSIGNED_DEVICE_UNREACHABLE
        networkConstraint: true
        reasonCodes: [ASSIGNED_SCANNER_NOT_DATA_REACHABLE, ENTERPRISE_ALTERNATE_DEVICE]
        summary: Assigned scanner HF-HDL-0192 is not DATA reachable. Reachability API succeeded. Swap to inventory scanner HF-HDL-0208 so the custody scan can complete before load-close. Network does not move the bag.
      networkResponses:
        getReachabilityStatus:
          httpStatus: 200
          latencyMs: 48
          raw:
            reachable: false
            lastSeen: "2026-08-17T16:10:00-04:00"
          evidence:
            type: DEVICE_REACHABILITY
            status: unreachable
            note: API successfully reported the assigned scanner is not DATA reachable. This is fulfilled demand, not an unfulfilled Network API.
