    getTwin:
      latencyMs: 36
      httpStatus: 200
      raw: { compatible: 8400, targetFirmware: "8.4.2", owner: ENTERPRISE_OTA }
      evidence: { type: DEVICE_TWIN, status: observed, eligible: 8400 }
    getPackage:
      latencyMs: 28
      httpStatus: 200
      raw: { packageId: FW-8-4-2, compatibleModels: true }
      evidence: { type: FIRMWARE_PACKAGE, status: ready, owner: ENTERPRISE_OTA }
    addDevicesToCampaign:
      latencyMs: 52
      httpStatus: 202
      raw: { accepted: true, simulatedEnterpriseApi: true, firmwareNotInstalled: true }
      evidence: { type: OTA_COHORT_SUBMITTED, status: accepted_pending_enterprise_rollout }
